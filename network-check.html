<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dolphin Vertebra</title>

<!--
  ==========================================================================
  SPECIMEN VIEWER — simple version
  ABM visual, July 2026
  ==========================================================================
  One page per specimen. No annotations, no interface chrome. The model on
  a plain background, turning by itself, draggable and zoomable.

  Self-hosted. Nothing loads from poly.cam, no CDN, no fonts, no analytics,
  no trackers, and no links that navigate away from this page.

  For each new specimen, copy this file, change the src and the title.
  ==========================================================================
-->

<script type="module" src="model-viewer.min.js"></script>

<style>
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:#000; overflow:hidden;
    -webkit-text-size-adjust:100%;
  }
  model-viewer{
    position:fixed; inset:0; width:100%; height:100%;
    background:#000;
    --progress-bar-color:#3fb950;
    --progress-mask:transparent;
    --poster-color:transparent;
  }
</style>
</head>
<body>

<model-viewer
    src="dolphin-vertebra.glb"
    alt="A dolphin vertebra collected from Henley Beach, shown as a rotatable 3D model"
    camera-orbit="42deg 78deg 1.75m"
    camera-target="0m 0.45m 0m"
    field-of-view="30deg"
    environment-image="neutral"
    exposure="0.95"
    shadow-intensity="0.7"
    shadow-softness="0.75"
    camera-controls
    touch-action="none"
    interaction-prompt="none"
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="24deg"
    loading="eager">
</model-viewer>

</body>
</html>
